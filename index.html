  const map = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};

    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
}

function showFatal(msg){
  let el = document.getElementById('fatal');

  }
  el.textContent = 'Ошибка: ' + msg;
}
window.addEventListener('error', e => { if (e.target && e.target.tagName === 'IMG') return; showFatal(e.message); });

const DB_KEY = 'portfolio_cms_v5'; /* новая версия — старые кэши с водяными знаками не используются */

let sb = null;

async function ensureSupabase(){
  const url = ENV.SUPABASE_URL.trim();
  const key = ENV.SUPABASE_PUBLISHABLE_KEY.trim();
  if (!url || !key || key.includes('ВСТАВЬТЕ_')) return false;
  if (key.startsWith('sb_secret_')) {
    throw new Error('В config.js указан секретный sb_secret_ ключ. Используйте только Publishable key.');
  }
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)) {
    throw new Error('Некорректный SUPABASE_URL в config.js');
  }
  if (sb) return true;
  if (!window.supabase) throw new Error('Не загрузилась библиотека Supabase. Проверьте интернет и блокировщики CDN.');
  sb = window.supabase.createClient(url, key);
  return true;
}
const useSb = () => !!sb;
const resultData = (result, action) => {

};

const localRead  = () => { try { return JSON.parse(localStorage.getItem(DB_KEY)) || null } catch (e) { return null } };
const localWrite = rows => localStorage.setItem(DB_KEY, JSON.stringify(rows));
if (!localRead()) localWrite(SEED);

const db = {
  async listAll(){
    if (await ensureSupabase()) {
      const result = await sb.from('projects').select('*').order('created_at', { ascending:false });
      return resultData(result, 'Не удалось загрузить проекты') || [];
    }
    await delay(120);
    return (localRead() || []).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  },
  async listPublic(){
    if (await ensureSupabase()) {
      const result = await sb.from('projects').select('*').eq('status','published').order('created_at', { ascending:false });
      return resultData(result, 'Не удалось загрузить опубликованные проекты') || [];
    }
    return (localRead() || []).filter(p => p.status === 'published');
  },
  async bySlug(slug){ return (await this.listAll()).find(p => p.slug === slug) || null },
  async byId(id){ return (await this.listAll()).find(p => p.id === id) || null },
  async create(row){
    row.id = uid(); row.created_at = now(); row.updated_at = now();
    if (await ensureSupabase()) {
      resultData(await sb.from('projects').insert([row]), 'Не удалось создать проект');
      return row;
    }
    const rows = localRead(); rows.push(row); localWrite(rows); return row;
  },
  async update(id, patch){
    patch.updated_at = now();
    if (await ensureSupabase()) {
      resultData(await sb.from('projects').update(patch).eq('id', id), 'Не удалось сохранить проект');
      return patch;
    }
    const rows = localRead();
    const i = rows.findIndex(p => p.id === id);
    if (i > -1) { rows[i] = { ...rows[i], ...patch }; localWrite(rows) }
    return patch;
  },
  async remove(id){
    if (await ensureSupabase()) {
      resultData(await sb.from('projects').delete().eq('id', id), 'Не удалось удалить проект');
      return true;
    }
    localWrite((localRead() || []).filter(p => p.id !== id));
    return true;
  },
  async duplicate(id){
    const src = await this.byId(id);
    if (!src) return null;
    const copy = { ...src, id:uid(), title:src.title + ' (копия)', slug:src.slug + '-copy', status:'draft', featured:false, created_at:now(), updated_at:now() };
    if (await ensureSupabase()) {
      resultData(await sb.from('projects').insert([copy]), 'Не удалось скопировать проект');
      return copy;
    }
    const rows = localRead(); rows.push(copy); localWrite(rows); return copy;
  }
};

const auth = {
  async isAuthed(){
    if (!(await ensureSupabase())) return false;
    const result = await sb.auth.getSession();
    if (result.error) throw result.error;
    return !!result.data.session;
  },
  async login(email, pass){
    if (!(await ensureSupabase())) throw new Error('Supabase не настроен: вставьте Publishable key в config.js');
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
  },
  async logout(){ if (useSb()) await sb.auth.signOut() }
};

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function confirmDialog(title, text, ok = 'Удалить'){
  return new Promise(res => {
    $('#modal-root').innerHTML = `
      <div class="modal-bg"><div class="modal">
        <h3 class="text-xl font-bold mb-2">${esc(title)}</h3>
        <p class="text-sm text-gray-500 mb-6">${esc(text)}</p>
        <div class="flex justify-end gap-3">
          <button id="m-no" class="a-btn ghost">Отмена</button>
          <button id="m-yes" class="a-btn danger">${esc(ok)}</button>
        </div>
      </div></div>`;
    $('#m-no').onclick  = () => { $('#modal-root').innerHTML = ''; res(false) };
    $('#m-yes').onclick = () => { $('#modal-root').innerHTML = ''; res(true) };
  });
}

const io = ('IntersectionObserver' in window)
  ? new IntersectionObserver(es => es.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('rv-in'); io.unobserve(en.target); }
    }), { threshold:.12 })
  : null;
function observeRv(){
  document.querySelectorAll('.rv').forEach(el => io ? io.observe(el) : el.classList.add('rv-in'));
}

function bindWorks(){
  const grid = $('#wgrid');
  if (!grid) return;
  const paint = filter => {
    const list = filter === 'all' ? WORKS_CACHE : WORKS_CACHE.filter(p => p.category === filter);
    grid.innerHTML = list.length
      ? list.map((p, i) => workCardHTML(p, i, '4/3')).join('')
      : '<div class="col-span-full py-24 text-center text-gray-400"><p class="text-2xl font-bold mb-2">Здесь пока пусто.</p><p class="text-sm">В этой категории ещё нет проектов.</p></div>';
  };
  paint('all');
  $('#filters').addEventListener('click', e => {
    const btn = e.target.closest('.fbtn');
    if (!btn) return;
    document.querySelectorAll('.fbtn').forEach(x => {
      x.classList.toggle('text-black', x === btn);
      x.classList.toggle('text-gray-400', x !== btn);
    });
    grid.style.opacity = 0;
    setTimeout(() => { paint(btn.dataset.f); grid.style.opacity = 1; }, 180);
  });
}

const formImgs = key => key === 'cover' ? (FORM_STATE.cover ? [FORM_STATE.cover] : []) : FORM_STATE.images[key];

function renderThumbs(key){
  const box = $('#th-' + key);
  if (!box) return;
  const arr = formImgs(key);
  box.innerHTML = arr.map((src, i) => `<div class="thumb"><img src="${esc(src)}" alt=""><div class="tb">
    ${i > 0 ? `<button data-mv="${i}" data-key="${key}" data-dir="-1">←</button>` : ''}
    ${i < arr.length - 1 ? `<button data-mv="${i}" data-key="${key}" data-dir="1">→</button>` : ''}
    <button data-rm="${i}" data-key="${key}">✕</button>
  </div></div>`).join('');
}

async function compressFile(file){
  const url = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(file); });
  const img = new Image();
  await new Promise(r => { img.onload = r; img.src = url; });
  const MAX = 1600;
  let w = img.width, h = img.height;
  if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.85);
}

async function handleFiles(key, files){
  for (const f of [...files]) {
    if (!f.type.startsWith('image/')) continue;
    const src = await compressFile(f);
    if (key === 'cover') FORM_STATE.cover = src; else FORM_STATE.images[key].push(src);
  }
  renderThumbs(key);
}

function bindForm(id){
  if (!$('#pform')) return;

  $('#f-title').addEventListener('input', e => { if (!id) $('#f-slug').value = slugify(e.target.value); });

  [['#f-svc','services'], ['#f-tech','tech']].forEach(([sel, key]) => {
    $(sel).addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      chip.classList.toggle('on');
      const v = chip.dataset.v, arr = FORM_STATE[key];
      arr.includes(v) ? arr.splice(arr.indexOf(v), 1) : arr.push(v);
    });
  });

  document.querySelectorAll('.dropzone').forEach(dz => {
    const key = dz.dataset.key, input = dz.querySelector('input');
    dz.onclick = () => input.click();
    input.onchange = () => handleFiles(key, input.files);
    ['dragover','dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => {
      e.preventDefault();
      dz.classList.toggle('over', ev === 'dragover');
      if (ev === 'drop') handleFiles(key, e.dataTransfer.files);
    }));
  });

  document.querySelectorAll('[data-addurl]').forEach(btn => btn.onclick = () => {
    const key = btn.dataset.addurl;
    const input = document.querySelector(`[data-url="${key}"]`);
    if (!input || !input.value.trim()) return;
    if (key === 'cover') FORM_STATE.cover = input.value.trim();
    else FORM_STATE.images[key].push(input.value.trim());
    input.value = '';
    renderThumbs(key);
  });
  ['cover','gallery','desktop','mobile'].forEach(renderThumbs);

  $('#f-save').onclick = async e => {
    e.preventDefault();
    const title = $('#f-title').value.trim();
    const slug = slugify($('#f-slug').value || title);
    if (!title || !slug) { toast('Заполните title и slug'); return; }
    const all = await db.listAll();
    if (all.some(x => x.slug === slug && x.id !== id)) { toast('Slug уже занят'); return; }
    const row = {
      title, slug,
      category : $('#f-cat').value,
      year : +$('#f-year').value || 2026,
      client : $('#f-client').value.trim(),
      site_url : $('#f-url').value.trim(),
      short_description : $('#f-short').value.trim(),
      description : $('#f-desc').value,
      cover_image : FORM_STATE.cover,
      gallery : FORM_STATE.images.gallery,
      desktop_images : FORM_STATE.images.desktop,
      mobile_images : FORM_STATE.images.mobile,
      services : FORM_STATE.services,
      technologies : FORM_STATE.tech,
      featured : $('#f-feat').checked,
      status : $('#f-status').value
    };
    if (id) { await db.update(id, row); toast('Изменения сохранены ✓'); }
    else { await db.create(row); toast('Проект создан ✓'); }
    nav('#/admin/projects');
  };
}

/* ── делегированные клики админки ──────────────────────── */
document.addEventListener('click', async e => {
  /* миниатюры: удалить / переставить */
  const rm = e.target.closest('[data-rm]');
  if (rm && FORM_STATE) {
    const k = rm.dataset.key, arr = formImgs(k);
    arr.splice(+rm.dataset.rm, 1);
    if (k === 'cover') FORM_STATE.cover = arr[0] || '';
    renderThumbs(k); return;
  }
  const mv = e.target.closest('[data-mv]');
  if (mv && FORM_STATE) {
    const k = mv.dataset.key, arr = formImgs(k);
    const i = +mv.dataset.mv, j = i + +mv.dataset.dir;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    if (k === 'cover') FORM_STATE.cover = arr[0] || '';
    renderThumbs(k); return;
  }
  /* действия в таблице проектов */
  const act = e.target.closest('[data-act]');
  if (act) {
    const id = act.dataset.id;
    if (act.dataset.act === 'status') {
      const p = await db.byId(id);
      await db.update(id, { status: p.status === 'published' ? 'draft' : 'published' });
      toast('Статус обновлён'); route();
    }
    if (act.dataset.act === 'feat') {
      const p = await db.byId(id);
      await db.update(id, { featured: !p.featured });
      toast(p.featured ? 'Убрано с главной' : 'Добавлено на главную'); route();
    }
    if (act.dataset.act === 'dup') { await db.duplicate(id); toast('Копия создана (draft)'); route(); }
    if (act.dataset.act === 'del') {
      if (await confirmDialog('Удалить проект?', `«${act.dataset.title || ''}» будет удалён из базы безвозвратно.`)) {
        await db.remove(id); toast('Проект удалён'); route();
      }
    }
    return;
  }
  if (e.target.closest('#a-logout')) { auth.logout(); nav('#/'); toast('Вы вышли из панели'); }
});

/* ════════════════════════════════════════════════════════
   10. ЭФФЕКТЫ: 3D-объект в hero + курсор
   ════════════════════════════════════════════════════════ */
let HERO3D = null;

function initHero3D(){
  const canvas = $('#hero-canvas');
  if (!canvas || !window.THREE || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 100);
    camera.position.z = 6;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(canvas.clientWidth || innerWidth, canvas.clientHeight || innerHeight, false);

    const knot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1.15, .34, 140, 20),
      new THREE.MeshStandardMaterial({ color:0x141414, roughness:.25, metalness:.85 })
    );
    knot.position.set(3.4, -.4, 0);
    scene.add(knot);
    scene.add(new THREE.AmbientLight(0xffffff, .55));
    const light = new THREE.PointLight(0xffffff, 1.1);
    light.position.set(4, 5, 6);
    scene.add(light);

    let mx = 0, my = 0;
    const onMove = e => { mx = e.clientX / innerWidth * 2 - 1; my = -(e.clientY / innerHeight * 2 - 1); };
    addEventListener('mousemove', onMove);
    const onResize = () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvas.clientWidth || innerWidth, canvas.clientHeight || innerHeight, false);
      knot.position.set(innerWidth < 768 ? 0 : 3.4, innerWidth < 768 ? 2.4 : -.4, 0);
    };
    addEventListener('resize', onResize);
    onResize();

    let raf;
    const loop = () => {
      raf = requestAnimationFrame(loop);
      knot.rotation.x += .004 + my * .006;
      knot.rotation.y += .005 + mx * .006;
      renderer.render(scene, camera);
    };
    loop();
    HERO3D = { raf, renderer, onMove, onResize };
  } catch (e) { /* webgl недоступен — не критично */ }
}

function destroyHero3D(){
  if (!HERO3D) return;
  cancelAnimationFrame(HERO3D.raf);
  removeEventListener('mousemove', HERO3D.onMove);
  removeEventListener('resize', HERO3D.onResize);
  try { HERO3D.renderer.dispose() } catch (e) {}
  HERO3D = null;
}

/* Курсор + маска-«фонарик» в hero */
const cursorEl = $('#cursor');
let targetX = innerWidth / 2, targetY = innerHeight / 2, curX = targetX, curY = targetY;

addEventListener('pointermove', e => {
  targetX = e.clientX; targetY = e.clientY;
  const hero = $('#hero-wrap');
  if (hero) {
    const r = hero.getBoundingClientRect();
    hero.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    hero.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  }
});
(function cursorLoop(){
  curX += (targetX - curX) * .18;
  curY += (targetY - curY) * .18;
  cursorEl.style.transform = `translate(${curX}px, ${curY}px) translate(-50%, -50%)`;
  requestAnimationFrame(cursorLoop);
})();
document.addEventListener('mouseover', e => cursorEl.classList.toggle('big', !!e.target.closest('a,button')));

/* ════════════════════════════════════════════════════════
   11. РОУТЕР И ИНИЦИАЛИЗАЦИЯ
   ════════════════════════════════════════════════════════ */
let pendingAdminRoute = null;
const nav = h => location.hash = h;
window.addEventListener('hashchange', () => route());

async function route(){
  destroyHero3D();
  document.body.classList.remove('admin-mode');
  try {
    const seg = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (seg[0] === 'admin') {
      document.body.classList.add('admin-mode');
      await renderAdmin(seg);
    } else {
      await renderPublic(seg);
    }
    window.scrollTo(0, 0);
  } catch (e) { showFatal(e && e.message || e); }
}

async function renderPublic(seg){
  const app = $('#app');
  const [a, b] = seg;
  app.innerHTML = '<div class="pt-40 pb-40 text-center"><div class="skel h-10 w-64 mx-auto mb-6 rounded"></div><div class="skel h-5 w-96 max-w-full mx-auto rounded"></div></div>';

  let html;
  if (!a) html = await viewHome();
  else if (a === 'works' && !b) html = await viewWorks();
  else if (a === 'works' && b) html = await viewDetail(b);
  else if (a === 'about') html = viewAbout();
  else if (a === 'services') html = viewServices();
  else if (a === 'contact') html = viewContact();
  else html = navbarHTML() + '<div class="pt-48 text-center min-h-screen"><h1 class="text-6xl font-bold">404</h1><p class="my-6 text-gray-500">Страница не найдена</p><a class="underline" href="#/">На главную</a></div>';

  if (a) html += homeArrowHTML(); /* стрелка «на главную» везде, кроме главной */
  app.innerHTML = html;

  if (a === 'works' && !b) bindWorks();
  if (!a) initHero3D();
  observeRv();
}

async function renderAdmin(seg){
  const app = $('#app');
  if (!(await auth.isAuthed())) {
    app.innerHTML = viewLogin();
    pendingAdminRoute = '#/' + seg.join('/');
    $('#login-form').onsubmit = async e => {
      e.preventDefault();
      try {
        await auth.login($('#lg-e').value.trim(), $('#lg-p').value);
        toast('Добро пожаловать ✓');
        nav(pendingAdminRoute || '#/admin');
        route();
      } catch (err) { $('#lg-err').textContent = err.message || 'Ошибка входа'; }
    };
    return;
  }
  const [_, a, b, c] = seg;
  if (!a) app.innerHTML = await viewDash();
  else if (a === 'projects' && !b) app.innerHTML = await viewProjects();
  else if (a === 'projects' && b === 'new') { app.innerHTML = await viewForm(null); bindForm(null); }
  else if (a === 'projects' && c === 'edit') { app.innerHTML = await viewForm(b); bindForm(b); }
  else if (a === 'setup') app.innerHTML = viewSetup();
  else app.innerHTML = await viewDash();
}

async function init(){
  route();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
